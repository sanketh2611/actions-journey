name: cleanup
on: push
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Start test database
        run: echo "Starting test database..."
      - name: Flaky check
        if: failure()
        run: |
          echo "Simulating a flaky check failure..."
          exit 1
      - name: Stop test database
        if: always()
        run: echo "Stopping test database..."
